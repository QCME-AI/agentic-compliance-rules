name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build and validate
        run: npm run ci

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        continue-on-error: true
        run: |
          git tag "rules-v${{ steps.version.outputs.current }}"
          git push origin "rules-v${{ steps.version.outputs.current }}"

      - name: GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "rules-v${{ steps.version.outputs.current }}"
          files: |
            dist/index.json
            dist/rules.min.json
          generate_release_notes: true

      - name: Publish to npm
        continue-on-error: true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Trigger manually from Actions UI: pick patch/minor/major, creates a PR with the bump
  bump-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: bump
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "new=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create PR
        run: |
          BRANCH="release/v${{ steps.bump.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: release v${{ steps.bump.outputs.new }}" \
            --body "Bumps version to \`${{ steps.bump.outputs.new }}\` (${{ github.event.inputs.bump }}). Merge to publish." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
