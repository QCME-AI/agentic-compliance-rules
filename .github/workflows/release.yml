name: Release

on:
  push:
    tags:
      - "rules-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/agentic-compliance-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run ci
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/agentic-compliance-rules/dist/index.json
            packages/agentic-compliance-rules/dist/rules.min.json
          generate_release_notes: true
