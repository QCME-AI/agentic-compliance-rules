name: Rules CI

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "schemas/**"
      - "tools/**"
      - "skills/**"
      - "package.json"
  pull_request:
    paths:
      - "rules/**"
      - "schemas/**"
      - "tools/**"
      - "skills/**"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - run: npm run validate:fixtures
      - run: npm run check:licensing
      - run: npm run build
      - name: Verify dist artifacts
        run: |
          test -f dist/index.json || (echo "dist/index.json missing" && exit 1)
          test -f dist/rules.min.json || (echo "dist/rules.min.json missing" && exit 1)
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
