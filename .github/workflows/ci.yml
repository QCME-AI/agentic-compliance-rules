name: Rules CI

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "schemas/**"
      - "tools/**"
      - "skills/**"
      - "test-integration/**"
      - "package.json"
  pull_request:
    paths:
      - "rules/**"
      - "schemas/**"
      - "tools/**"
      - "skills/**"
      - "test-integration/**"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - run: npm run validate:fixtures
      - run: npm run check:licensing
      - run: npm run build:all
      - name: Verify dist artifacts
        run: |
          test -f dist/index.json || (echo "dist/index.json missing" && exit 1)
          test -f dist/rules.min.json || (echo "dist/rules.min.json missing" && exit 1)
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
      - name: Verify skill references
        run: |
          for fw in can-spam ccpa coppa ftc-claims ftc-endorsements ftc-dark-patterns gdpr hipaa sec-482 sec-marketing; do
            test -f "skills/compliance-officer/references/rules-${fw}.json" || \
              (echo "skills/compliance-officer/references/rules-${fw}.json missing" && exit 1)
          done

  integration:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build package
        run: npm run build:all
      - name: Create tarball
        run: npm pack
      - name: Run npm install integration tests
        run: node test-integration/test-npm-install.mjs
      - name: Run skill install integration tests
        run: node test-integration/test-skill-install.mjs

  screenshots:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install playwright && npx playwright install chromium --with-deps
      - name: Generate screenshots from HTML samples
        run: node test-integration/generate-screenshots.mjs
      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-screenshots
          path: test-integration/samples/screenshots/
          retention-days: 14
